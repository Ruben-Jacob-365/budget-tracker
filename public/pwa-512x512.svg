<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Subtle Glass Glow -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Main Wallet/Card Graphic Container -->
  <g filter="url(#shadow)">
    <!-- Glassmorphic Card Frame -->
    <rect x="96" y="140" width="320" height="232" rx="28" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" />
    
    <!-- Card Stripe / Accent -->
    <path d="M 96 196 L 416 196" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />
    
    <!-- Upward Growth Chart Line -->
    <path d="M 136 300 Q 180 280, 220 290 T 310 240 T 376 210" fill="none" stroke="url(#chartGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Sparkle / Arrow Head -->
    <circle cx="376" cy="210" r="10" fill="#38bdf8" />
    <circle cx="376" cy="210" r="18" fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="3" />

    <!-- Coin / Currency Emblem -->
    <g transform="translate(136, 220)">
      <circle cx="28" cy="28" r="24" fill="#10b981" />
      <text x="28" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
    </g>
  </g>
</svg>
