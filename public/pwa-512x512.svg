<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circle background -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Subtle inner circle ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Chart bars (bold, high contrast, white) -->
  <!-- Bar 1 -->
  <rect x="112" y="280" width="52" height="100" rx="12" fill="#ffffff" fill-opacity="0.35"/>
  <!-- Bar 2 -->
  <rect x="182" y="220" width="52" height="160" rx="12" fill="#ffffff" fill-opacity="0.6"/>
  <!-- Bar 3 -->
  <rect x="252" y="170" width="52" height="210" rx="12" fill="#ffffff" fill-opacity="0.85"/>
  <!-- Bar 4 -->
  <rect x="322" y="130" width="52" height="250" rx="12" fill="#ffffff"/>

  <!-- Trend line over bars -->
  <path d="M 138 275 C 175 230, 215 205, 278 175 S 350 135, 398 108"
        fill="none"
        stroke="#ffffff"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-opacity="0.9"/>

  <!-- Trend arrow dot -->
  <circle cx="398" cy="108" r="14" fill="#ffffff"/>

  <!-- Upward arrow inside dot -->
  <path d="M 398 122 L 398 96 M 390 104 L 398 96 L 406 104"
        stroke="#1e1b4b"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Dollar symbol - large, bold, visible -->
  <text x="256" y="102"
        font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="72"
        font-weight="900"
        fill="#ffffff"
        fill-opacity="0.18"
        text-anchor="middle"
        dominant-baseline="middle">$</text>
</svg>
